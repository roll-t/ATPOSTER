<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang khởi động Nexora Video...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #15112f 0%, #0B0F1A 72%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: linear-gradient(145deg, #081120 0%, #120c28 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px -5px rgba(0, 209, 255, 0.38), 0 8px 26px rgba(255, 79, 216, 0.2);
      position: relative;
    }
    .logo-box img {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }
    .logo-pulse {
      position: absolute;
      inset: -4px;
      border-radius: 24px;
      border: 2px solid rgba(168, 85, 255, 0.55);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }
    .title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(0, 209, 255, 0.12);
      color: #00D1FF;
      border: 1px solid rgba(168, 85, 255, 0.35);
      margin-top: -0.5rem;
    }
    .progress-bar-container {
      width: 260px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #00D1FF, #A855FF, #FF4FD8);
      border-radius: 9999px;
      animation: indeterminate 1.5s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -45%; width: 45%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 45%; }
    }
    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <div class="logo-pulse"></div>
      <img src="../public/icons/logo.png" alt="Nexora Video">
    </div>
    <div>
      <h1 class="title">Nexora Video</h1>
      <span class="badge">AI Video Studio</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    <p class="status-text" id="status">Đang khởi động hệ thống Studio...</p>
  </div>

  <script>
    const statuses = [
      'Đang nạp video render engine...',
      'Đang kiểm tra kết nối VieNeu & Gemini...',
      'Đang mở giao diện làm việc...'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % statuses.length;
      const el = document.getElementById('status');
      if (el) el.innerText = statuses[idx];
    }, 1800);
  </script>
</body>
</html>
