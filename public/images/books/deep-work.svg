<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" rx="6" fill="url(#bg-deep)"/>
  <rect x="0" y="0" width="12" height="300" fill="rgba(0,0,0,0.3)"/>
  <line x1="12" y1="0" x2="12" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Focus / Prism Motif -->
  <g transform="translate(100, 100)">
    <polygon points="0,-28 26,22 -26,22" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="4" r="7" fill="#ffffff"/>
    <line x1="0" y1="-28" x2="0" y2="22" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="162" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">DEEP</text>
  <text x="100" y="188" fill="#22d3ee" font-size="22" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">WORK</text>
  
  <text x="100" y="210" fill="#e0f2fe" font-size="8" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">LÀM RA LÀM CHƠI RA CHƠI</text>
  <text x="100" y="222" fill="#a5f3fc" font-size="7" font-family="system-ui, sans-serif" text-anchor="middle">Tập Trung Sâu Trong Thế Giới Xao Nhãng</text>
  
  <line x1="55" y1="236" x2="145" y2="236" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Author -->
  <text x="100" y="258" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">CAL NEWPORT</text>
  <text x="100" y="274" fill="#67e8f9" font-size="7.5" font-family="system-ui, sans-serif" text-anchor="middle">WALL STREET JOURNAL BESTSELLER</text>
