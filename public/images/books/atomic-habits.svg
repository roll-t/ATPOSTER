<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="dots" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" rx="6" fill="url(#bg)"/>
  <rect x="0" y="0" width="12" height="300" fill="rgba(0,0,0,0.06)"/>
  <line x1="12" y1="0" x2="12" y2="300" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  
  <!-- Bestseller Banner -->
  <rect x="25" y="24" width="150" height="18" rx="4" fill="#0f172a"/>
  <text x="100" y="36" fill="#fbbf24" font-size="8" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">#1 NYT BESTSELLER</text>
  
  <!-- Atom Dots Graphic -->
  <g transform="translate(100, 115)">
    <circle cx="-50" cy="0" r="3" fill="#f59e0b" opacity="0.4"/>
    <circle cx="-35" cy="-8" r="4" fill="#f59e0b" opacity="0.6"/>
    <circle cx="-20" cy="5" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="-5" cy="-4" r="6" fill="url(#dots)"/>
    <circle cx="10" cy="6" r="7" fill="url(#dots)"/>
    <circle cx="28" cy="-3" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="7" r="4" fill="#ef4444" opacity="0.6"/>
    <circle cx="55" cy="0" r="3" fill="#ef4444" opacity="0.4"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="150" fill="#0f172a" font-size="20" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">ATOMIC</text>
  <text x="100" y="176" fill="#0f172a" font-size="20" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">HABITS</text>
  
  <text x="100" y="200" fill="#e11d48" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">THAY ĐỔI TÍ HON</text>
  <text x="100" y="214" fill="#64748b" font-size="8" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Hiệu Quả Bất Ngờ</text>
  
  <line x1="45" y1="230" x2="155" y2="230" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Author -->
  <text x="100" y="258" fill="#0f172a" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">JAMES CLEAR</text>
  <text x="100" y="274" fill="#94a3b8" font-size="7.5" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">HƠN 15 TRIỆU BẢN ĐÃ BÁN</text>
</svg>
