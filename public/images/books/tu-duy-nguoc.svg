<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-reverse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="gold-rev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" rx="6" fill="url(#bg-reverse)"/>
  <rect x="0" y="0" width="12" height="300" fill="rgba(0,0,0,0.3)"/>
  <line x1="12" y1="0" x2="12" y2="300" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Inverted Arrow / Geometric Motif -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#gold-rev)" stroke-width="1.5"/>
    <!-- Inverted curved arrow -->
    <path d="M-15 8 C-15 -12 15 -12 15 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="12,12 20,8 16,0" fill="#ffffff"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="165" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">TƯ DUY NGƯỢC</text>
  <text x="100" y="188" fill="url(#gold-rev)" font-size="9" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">ĐỂ THÀNH CÔNG VƯỢT TRỘI</text>
  
  <text x="100" y="210" fill="#fecaca" font-size="7.5" font-family="system-ui, sans-serif" text-anchor="middle">Lội Ngược Dòng Phá Vỡ Định Kiến Cũ</text>
  
  <line x1="55" y1="230" x2="145" y2="230" stroke="url(#gold-rev)" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Author -->
  <text x="100" y="254" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">NGUYỄN ANH DŨNG</text>
  <text x="100" y="270" fill="#fca5a5" font-size="7" font-family="system-ui, sans-serif" text-anchor="middle">SÁCH BÁN CHẠY TIKTOK BOOKTOK</text>
</svg>
