<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hormozi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="neon-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" rx="6" fill="url(#bg-hormozi)"/>
  <rect x="0" y="0" width="12" height="300" fill="rgba(255,255,255,0.05)"/>
  <line x1="12" y1="0" x2="12" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Banner -->
  <rect x="25" y="24" width="150" height="18" rx="4" fill="#27272a"/>
  <text x="100" y="36" fill="#facc15" font-size="8" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">#1 AMAZON BESTSELLER</text>
  
  <!-- Big 100M Motif -->
  <g transform="translate(100, 105)">
    <text x="0" y="8" fill="url(#neon-gold)" font-size="34" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-1">$100M</text>
  </g>
  
  <!-- Title -->
  <text x="100" y="156" fill="#ffffff" font-size="20" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">OFFERS</text>
  
  <text x="100" y="180" fill="#facc15" font-size="8.5" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">LỜI ĐỀ NGHỊ KHÔNG THỂ TỪ CHỐI</text>
  <text x="100" y="196" fill="#a1a1aa" font-size="7" font-family="system-ui, sans-serif" text-anchor="middle">Khiến Khách Hàng Cảm Thấy Ngu Ngốc Nếu Nói Không</text>
  
  <line x1="45" y1="220" x2="155" y2="220" stroke="#3f3f46" stroke-width="1"/>
  
  <!-- Author -->
  <text x="100" y="248" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">ALEX HORMOZI</text>
  <text x="100" y="266" fill="#71717a" font-size="7.5" font-family="system-ui, sans-serif" text-anchor="middle">DOANH NHÂN &amp; NHÀ ĐẦU TƯ TRIỆU ĐÔ</text>
</svg>
