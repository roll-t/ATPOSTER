<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dad-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" rx="6" fill="url(#bg-dad)"/>
  <rect x="0" y="0" width="12" height="300" fill="rgba(0,0,0,0.3)"/>
  <line x1="12" y1="0" x2="12" y2="300" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Top Gold Header -->
  <rect x="0" y="24" width="200" height="24" fill="url(#dad-gold)"/>
  <text x="106" y="39" fill="#3b0764" font-size="8" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">DẠY CON LÀM GIÀU — TẬP 1</text>
  
  <!-- Big Cashflow Quadrant Motif -->
  <g transform="translate(100, 100)">
    <rect x="-32" y="-32" width="64" height="64" rx="6" fill="none" stroke="url(#dad-gold)" stroke-width="1.5"/>
    <line x1="0" y1="-32" x2="0" y2="32" stroke="url(#dad-gold)" stroke-width="1"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="url(#dad-gold)" stroke-width="1"/>
    <text x="-16" y="-12" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">E</text>
    <text x="16" y="-12" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">B</text>
    <text x="-16" y="20" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">S</text>
    <text x="16" y="20" fill="url(#dad-gold)" font-size="12" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">I</text>
  </g>
  
  <!-- Title -->
  <text x="100" y="165" fill="#f8fafc" font-size="16" font-family="Georgia, serif" font-weight="900" text-anchor="middle" letter-spacing="1">CHA GIÀU</text>
  <text x="100" y="188" fill="url(#dad-gold)" font-size="18" font-family="Georgia, serif" font-weight="900" text-anchor="middle" letter-spacing="1">CHA NGHÈO</text>
  
  <text x="100" y="210" fill="#cbd5e1" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">Để Tiền Làm Việc Cho Bạn</text>
  <text x="100" y="222" fill="#94a3b8" font-size="7" font-family="system-ui, sans-serif" text-anchor="middle">Rich Dad Poor Dad</text>
  
  <line x1="55" y1="236" x2="145" y2="236" stroke="url(#dad-gold)" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Author -->
  <text x="100" y="258" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">ROBERT KIYOSAKI</text>
  <text x="100" y="274" fill="#cbd5e1" font-size="7.5" font-family="system-ui, sans-serif" text-anchor="middle">VÀ SHARON LECHTER</text>
</svg>
