<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-money" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#041f18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" rx="6" fill="url(#bg-money)"/>
  <rect x="0" y="0" width="12" height="300" fill="rgba(0,0,0,0.25)"/>
  <line x1="12" y1="0" x2="12" y2="300" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Outer Gold Border -->
  <rect x="22" y="20" width="156" height="260" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
  
  <!-- Badge -->
  <text x="100" y="48" fill="url(#gold)" font-size="7" font-family="Georgia, serif" font-weight="700" text-anchor="middle" letter-spacing="2">INTERNATIONAL BESTSELLER</text>
  
  <!-- Center Coin / Ring Motif -->
  <g transform="translate(100, 105)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>
    <text x="0" y="6" fill="url(#gold)" font-size="18" font-family="Georgia, serif" font-weight="700" text-anchor="middle">$</text>
  </g>
  
  <!-- Title -->
  <text x="100" y="165" fill="#f8fafc" font-size="14" font-family="Georgia, serif" font-weight="800" text-anchor="middle" letter-spacing="1">TÂM LÝ HỌC</text>
  <text x="100" y="184" fill="url(#gold)" font-size="18" font-family="Georgia, serif" font-weight="900" text-anchor="middle" letter-spacing="2">VỀ TIỀN</text>
  
  <text x="100" y="208" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif" font-weight="500" text-anchor="middle">Bài Học Bất Tử Về Sự Giàu Có</text>
  <text x="100" y="220" fill="#64748b" font-size="7" font-family="system-ui, sans-serif" text-anchor="middle">The Psychology of Money</text>
  
  <!-- Author -->
  <line x1="60" y1="236" x2="140" y2="236" stroke="url(#gold)" stroke-width="0.75" opacity="0.5"/>
  <text x="100" y="258" fill="#f8fafc" font-size="11" font-family="Georgia, serif" font-weight="700" text-anchor="middle" letter-spacing="1">MORGAN HOUSEL</text>
</svg>
